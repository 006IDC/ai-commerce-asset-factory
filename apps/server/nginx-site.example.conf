server {
    listen 80;
    server_name example.com;
    server_tokens off;

    root /www/wwwroot/asset-factory/public;
    index index.php;
    client_max_body_size 160m;

    # 这些响应头不依赖 TLS，HTTP/HTTPS 入口都应保留。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://static.geetest.com https://*.geetest.com; style-src 'self' 'unsafe-inline' https://*.geetest.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.geetest.com; media-src 'self' blob: https:; frame-src https://*.geetest.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 生产站请将 HTTP 入口重定向 HTTPS，并在 443 TLS server 块中启用：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?s=$uri&$query_string;
    }

    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 240s;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }
}
